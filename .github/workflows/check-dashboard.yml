name: Check electricity dashboard

on:
  push:
    paths:
      - 'src/web_panel.py'
      - 'src/build_site.py'
      - 'src/templates/**'
      - 'src/static/**'
      - 'tests_web/**'
      - 'requirements-web.txt'
      - '.github/workflows/check-dashboard.yml'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'src/web_panel.py'
      - 'src/build_site.py'
      - 'src/templates/**'
      - 'src/static/**'
      - 'tests_web/**'
      - 'requirements-web.txt'
      - '.github/workflows/check-dashboard.yml'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-web.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements-web.txt
      - run: python -m unittest discover -s tests_web
      - run: node --test tests_web/*.cjs
      - name: Build without collected data
        run: python src/build_site.py --csv-path "$RUNNER_TEMP/uncollected.csv" --output-dir "$RUNNER_TEMP/dashboard"
